:root {
  --ink: #070b12;
  --panel: #0d1520;
  --panel2: #111c28;
  --gold: #f2c14e;
  --gold2: #d99a3a;
  --gold3: #ffe4a1;
  --teal: #5ec8bd;
  --rose: #d46b7a;
  --cream: #f1e5ca;
  --dim: #8d99a6;
  --line: #3c4b5d;
  --font: "FusionPixel", "PingFang SC", "Hiragino Sans GB", monospace;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  background: #05080c; color: var(--cream);
  font-family: var(--font);
  overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
}
body { display: grid; place-items: center; background: #05080c; }
#app {
  position: relative;
  width: min(100vw, 480px);
  height: 100vh; height: 100dvh;
  overflow: hidden;
  background: #08110f;
  border: 2px solid #26374a;
  box-shadow: 0 0 0 3px #020406, 0 0 40px #000;
}
#game {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block; touch-action: none;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
.scanlines {
  position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
  opacity: .22; mix-blend-mode: multiply;
}
.vignette {
  position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background: linear-gradient(180deg, rgba(3,6,9,.72) 0 10%, transparent 15% 84%, rgba(3,6,9,.75) 91% 100%);
  box-shadow: inset 0 0 80px rgba(0,0,0,.55);
}

/* HUD */
#hud {
  position: absolute; left: 0; right: 0; top: 0; z-index: 4;
  padding: max(7px, env(safe-area-inset-top)) 8px 0;
  pointer-events: none;
}
.hud-row { display: flex; align-items: stretch; gap: 6px; }
.hud-box {
  background: var(--panel);
  border: 2px solid var(--line);
  box-shadow: 3px 3px 0 #020406;
  padding: 5px 7px;
}
.stat { min-width: 86px; }
.stat span { display: block; color: var(--dim); font-size: 8px; letter-spacing: .08em; }
.stat b { display: block; margin-top: 1px; font-size: 20px; line-height: 1; color: var(--cream); }
.stat.balls b { color: var(--gold3); }
.stat.jack b { color: var(--gold); font-size: 17px; }
.fever-box { flex: 1; min-width: 110px; }
.fever-head { display: flex; justify-content: space-between; color: var(--dim); font-size: 8px; }
.fever-head b { color: var(--teal); }
.fever-track { height: 9px; margin-top: 5px; background: #04080d; border: 1px solid #33465b; position: relative; overflow: hidden; }
.fever-track i { display: block; width: 0%; height: 100%; background: var(--teal); }
.fever-track i.hot { background: var(--gold); }
.fever-box.fever-on { border-color: var(--gold); }
.fever-box.fever-on .fever-track i { background: var(--gold); }
.hud-row2 { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
.score-box { flex: 1; display: flex; align-items: baseline; justify-content: space-between; padding: 4px 8px; }
.score-box span { color: var(--dim); font-size: 8px; }
.score-box b { color: var(--cream); font-size: 17px; }
.combo {
  display: none; padding: 4px 7px; background: #25151b; border: 2px solid var(--rose);
  box-shadow: 2px 2px 0 #020406; color: var(--rose); font-size: 8px; white-space: nowrap;
}
.combo b { color: var(--cream); font-size: 12px; }
.combo strong { color: var(--gold3); font-size: 14px; margin-left: 3px; }
.combo.active { display: block; }
.slot-chip { padding: 4px 7px; border: 2px solid var(--line); background: #091019; color: var(--teal); font-size: 8px; white-space: nowrap; }
.slot-chip b { color: var(--gold3); font-size: 13px; }

/* controls */
#controls {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 4;
  padding: 10px 10px max(18px, env(safe-area-inset-bottom));
  display: flex; align-items: flex-end; justify-content: center; gap: 8px;
  background: linear-gradient(0deg, rgba(5,8,12,.95), rgba(5,8,12,.62) 70%, transparent);
  pointer-events: none;
}
#launch {
  pointer-events: auto;
  width: 94px; height: 68px;
  border: 2px solid var(--gold3);
  background: var(--gold);
  color: #1b1106; font-family: var(--font);
  box-shadow: 4px 4px 0 #020406;
  cursor: pointer; padding: 6px 4px;
}
#launch:active, #launch.held { transform: translate(2px,2px); box-shadow: 2px 2px 0 #020406; }
#launch b { display: block; font-size: 20px; line-height: 1; }
#launch small { display: block; font-size: 8px; margin-top: 4px; color: #4a2c0c; }
.tool {
  pointer-events: auto;
  width: 48px; height: 48px;
  border: 2px solid var(--line);
  background: var(--panel);
  color: var(--cream); font-family: var(--font); font-size: 9px;
  box-shadow: 3px 3px 0 #020406;
  cursor: pointer;
}
.tool:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #020406; }
.tool.on { border-color: var(--teal); color: var(--teal); }
#helpBtn, #muteBtn { width: 38px; height: 38px; align-self: flex-end; }
.controls-hint {
  position: absolute; left: 50%; bottom: 92px; transform: translateX(-50%);
  z-index: 3; color: var(--dim); font-size: 8px; white-space: nowrap;
  pointer-events: none; transition: opacity .25s;
}

/* announcement / toast */
#announce {
  position: absolute; left: 0; right: 0; top: 28%; z-index: 6;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  pointer-events: none;
}
.ann {
  padding: 7px 14px; background: #080d14; border: 2px solid var(--gold);
  border-left: 4px solid var(--rose); border-right: 4px solid var(--teal);
  box-shadow: 4px 4px 0 #020406;
  color: var(--gold3); font-size: 20px; line-height: 1;
  animation: annIn .18s steps(3) both;
}
.ann.rose { border-color: var(--rose); color: #ffdce4; }
.ann.teal { border-color: var(--teal); color: #d8fffa; }
.ann.out { animation: annOut .3s steps(3) both; }
@keyframes annIn { from { transform: scale(.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes annOut { to { transform: translateY(-6px); opacity: 0; } }
#toast {
  position: absolute; left: 50%; bottom: 126px; transform: translateX(-50%);
  z-index: 5; padding: 4px 8px; background: #080d14; border: 1px solid var(--line);
  color: var(--dim); font-size: 8px; white-space: nowrap; opacity: 0;
  transition: opacity .2s; pointer-events: none;
}
#toast.show { opacity: 1; }

/* overlays */
#overlay {
  position: absolute; inset: 0; z-index: 20;
  display: flex; align-items: center; justify-content: center;
  padding: 18px 16px;
  background: rgba(4,7,11,.9);
}
#overlay.hidden { display: none; }
.panel {
  width: 100%; max-width: 380px;
  background: var(--panel); border: 2px solid var(--line);
  box-shadow: 6px 6px 0 #020406;
  padding: 20px 18px;
  position: relative; text-align: center;
}
.panel::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--gold); }
.kicker { color: var(--teal); font-size: 9px; letter-spacing: .16em; }
.logo {
  margin: 10px 0 4px; color: var(--gold); font-size: clamp(38px, 12vw, 58px);
  line-height: 1.04; text-shadow: 3px 3px 0 #5c3511, 6px 6px 0 #000;
}
.logo span { color: var(--cream); text-shadow: 3px 3px 0 #8d4f18, 6px 6px 0 #000; }
.sub { color: var(--dim); font-size: 10px; line-height: 1.6; margin: 9px 0 15px; }
.best { color: var(--dim); font-size: 9px; margin: 0 0 12px; }
.best b { color: var(--gold); font-size: 15px; margin-left: 3px; }
.btn {
  display: block; width: 100%; min-height: 46px; margin-top: 8px;
  border: 2px solid var(--gold3); background: var(--gold); color: #1a1006;
  font-family: var(--font); font-size: 17px; cursor: pointer;
  box-shadow: 4px 4px 0 #020406;
}
.btn:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 #020406; }
.btn.secondary { background: var(--panel2); color: var(--cream); border-color: var(--line); font-size: 12px; min-height: 40px; box-shadow: 3px 3px 0 #020406; }
.btn.ghost { background: transparent; color: var(--dim); border-color: var(--line); box-shadow: none; font-size: 10px; min-height: 34px; }
.help-list { text-align: left; margin: 12px 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
.help-list li { display: grid; grid-template-columns: 20px 1fr; gap: 6px; color: #cfc4ad; font-size: 10px; line-height: 1.6; }
.help-list b { color: var(--gold); font-size: 13px; }
.help-list li:nth-child(2) b { color: var(--teal); }
.help-list li:nth-child(3) b { color: var(--rose); }
.help-list li:nth-child(4) b { color: var(--gold3); }
.panel h2 { margin: 0 0 4px; color: var(--gold3); font-size: 24px; }
.small { color: var(--dim); font-size: 8px; line-height: 1.6; }
#boot { position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; background: #070b12; color: var(--gold); font-size: 18px; }
#boot.hide { display: none; }

/* fever skin */
body.fever #hud .hud-box { border-color: var(--gold); }
body.fever .stat.balls b { color: var(--gold); }
body.fever .slot-chip { border-color: var(--gold); color: var(--gold3); }

@media (max-width: 360px) {
  #hud { padding-left: 6px; padding-right: 6px; }
  .stat { min-width: 72px; padding: 4px 5px; }
  .stat b { font-size: 17px; }
  .stat.jack b { font-size: 14px; }
  .fever-box { min-width: 90px; padding: 4px 5px; }
  #launch { width: 84px; height: 62px; }
  #launch b { font-size: 18px; }
  .tool { width: 44px; height: 44px; }
  #helpBtn, #muteBtn { width: 34px; height: 34px; }
}
@media (orientation: landscape) and (max-height: 540px) {
  #app { width: min(100vw, 56dvh); }
}

/* 3D voxel layer */
#gl {
  position: absolute; inset: 0; width: 100%; height: 100%;
  display: block; z-index: 0; touch-action: none;
  image-rendering: pixelated; image-rendering: crisp-edges;
}
#floatLayer { position: absolute; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
.float3d {
  position: absolute; transform: translate(-50%, -50%);
  font-family: var(--font); font-size: 12px; font-weight: 700;
  color: var(--cream); text-shadow: 2px 2px 0 #000;
  white-space: nowrap; will-change: transform, opacity;
}
#flash { position: absolute; inset: 0; z-index: 2; pointer-events: none; background: #ffe7a0; opacity: 0; mix-blend-mode: screen; }

#labels { position: absolute; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
.board-label {
  position: absolute; transform: translate(-50%, -50%);
  font-family: var(--font); font-weight: 700; color: var(--cream);
  text-shadow: 2px 2px 0 #030608; white-space: nowrap; letter-spacing: .03em;
}
.board-label.jp { color: var(--gold3); font-size: 22px; text-shadow: 2px 2px 0 #5c3511, 4px 4px 0 #000; }
.board-label.start { color: var(--cream); font-size: 11px; }
.board-label.spin { color: #86b0a5; font-size: 8px; }
.board-label.tulip { color: #9fc2b5; font-size: 8px; }
.board-label.pocket { color: var(--cream); font-size: 10px; }
.board-label.sub { color: #bfa365; font-size: 8px; letter-spacing: .08em; }

/* tablet layout: fill the screen with the cabinet, scale up controls */
@media (min-width: 700px) {
  #app {
    width: 100vw; max-width: none; height: 100dvh;
    border-left: 0; border-right: 0;
  }
  #hud {
    left: 50%; right: auto; transform: translateX(-50%);
    width: min(94vw, 780px);
    padding-top: max(12px, env(safe-area-inset-top));
  }
  #controls {
    left: 50%; right: auto; transform: translateX(-50%);
    width: min(88vw, 720px);
    padding-bottom: max(24px, env(safe-area-inset-bottom));
  }
  #launch { width: 112px; height: 80px; }
  #launch b { font-size: 23px; }
  #launch small { font-size: 9px; }
  .tool { width: 56px; height: 56px; font-size: 10px; }
  #helpBtn, #muteBtn { width: 46px; height: 46px; }
  .stat { min-width: 104px; }
  .stat b { font-size: 24px; }
  .stat.jack b { font-size: 21px; }
  .fever-track { height: 11px; }
  .score-box b { font-size: 20px; }
  .slot-chip { font-size: 9px; padding: 5px 9px; }
  .slot-chip b { font-size: 15px; }
  .combo { font-size: 9px; }
  .combo b { font-size: 14px; }
  .combo strong { font-size: 16px; }
  #overlay .panel { max-width: 510px; padding: 26px 24px; }
  .logo { font-size: clamp(52px, 9vw, 70px); }
  .sub { font-size: 12px; }
  .btn { min-height: 52px; font-size: 19px; }
  .btn.secondary { min-height: 44px; font-size: 14px; }
  .announce, .ann { font-size: 24px; }
  #toast { font-size: 10px; bottom: 140px; }
}
@media (min-width: 900px) and (orientation: landscape) {
  #hud { width: min(88vw, 900px); }
  #controls { width: min(70vw, 720px); }
  #app { height: 100dvh; }
}

/* ============ compact HUD (keeps the top-right ball outlet clear) ============ */
#hud {
  left: 8px; right: auto; top: max(8px, env(safe-area-inset-top));
  width: 142px; padding: 0;
  pointer-events: none;
}
.hud-card {
  background: rgba(7, 11, 18, .78);
  border: 2px solid #33465b;
  box-shadow: 2px 2px 0 #020406;
  padding: 5px 7px 6px;
}
.hud-line { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; line-height: 1.15; }
.hud-line span { color: var(--dim); font-size: 7px; letter-spacing: .06em; }
.hud-line b { color: var(--cream); font-size: 12px; }
.hud-line.main b { color: var(--gold3); font-size: 20px; line-height: 1.05; }
.hud-line:nth-child(3) b { color: var(--gold); font-size: 11px; }
.fever-line { display: flex; justify-content: space-between; align-items: baseline; margin-top: 4px; }
.fever-line span { color: var(--dim); font-size: 7px; letter-spacing: .06em; }
.fever-line b { color: var(--teal); font-size: 9px; }
.fever-track { height: 5px; margin-top: 2px; background: #04080d; border: 1px solid #2c3d4e; }
.fever-track i { display: block; height: 100%; width: 0; background: var(--teal); }
.map-line { margin-top: 4px; padding-top: 3px; border-top: 1px solid #263747; color: #b7a47e; font-size: 7px; letter-spacing: .05em; white-space: nowrap; }
.hidden-src { display: none !important; }
#hud .combo {
  position: static; display: none; margin-top: 5px; width: fit-content;
  padding: 3px 6px; font-size: 7px; background: #24161b; border: 2px solid var(--rose);
  box-shadow: 2px 2px 0 #020406;
}
#hud .combo b { font-size: 10px; }
#hud .combo strong { font-size: 12px; }
#hud .combo.active { display: flex; gap: 3px; align-items: baseline; }

/* power meter inside launch button */
#launch { position: relative; padding-bottom: 13px; }
#launch .power-track {
  position: absolute; left: 7px; right: 7px; bottom: 5px; height: 5px;
  background: #2a1b0c; border: 1px solid #6b4a18;
  display: block; overflow: hidden;
}
#launch .power-track i {
  display: block; height: 100%; width: 0%; background: var(--teal);
}
#launch.charging .power-track i { background: var(--gold); }
#launch.charging { border-color: var(--teal); }

/* map picker on title */
.map-picks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0 12px; }
.map-card {
  padding: 8px 5px 7px; min-height: 82px; text-align: left;
  background: #0a121b; border: 2px solid #34475b; color: var(--cream);
  font-family: var(--font); cursor: pointer; box-shadow: 2px 2px 0 #020406;
}
.map-card b { display: block; font-size: 13px; line-height: 1.2; color: var(--gold3); }
.map-card span { display: block; margin-top: 4px; font-size: 7px; line-height: 1.4; color: var(--dim); }
.map-card em { display: block; margin-top: 4px; font-size: 7px; font-style: normal; color: var(--teal); }
.map-card.active { border-color: var(--gold); }
.map-card:active { transform: translate(1px,1px); }
.map-hint { color: var(--dim); font-size: 8px; margin: 0 0 8px; }
@media (max-width: 360px) {
  #hud { width: 124px; left: 6px; }
  .hud-line.main b { font-size: 17px; }
  .map-picks { gap: 4px; }
  .map-card { padding: 6px 4px; min-height: 76px; }
  .map-card b { font-size: 11px; }
  .map-card span { font-size: 6px; }
}
@media (min-width: 700px) {
  #hud { left: max(14px, env(safe-area-inset-left)); right: auto; transform: none; top: max(14px, env(safe-area-inset-top)); width: 178px; }
  .hud-card { padding: 8px 10px 9px; }
  .hud-line.main b { font-size: 25px; }
  .hud-line b { font-size: 15px; }
  .hud-line span { font-size: 8px; }
  .fever-track { height: 7px; }
  .map-line { font-size: 8px; }
  .map-picks { gap: 8px; }
  .map-card { min-height: 96px; padding: 10px 8px; }
  .map-card b { font-size: 16px; }
  .map-card span { font-size: 8px; }
  .map-card em { font-size: 8px; }
}
#mapBtn { width: 44px; height: 44px; font-size: 8px; }
@media (min-width: 700px) { #mapBtn { width: 56px; height: 56px; font-size: 10px; } }
@media (min-width: 700px) {
  #hud { left: max(14px, env(safe-area-inset-left)); right: auto; transform: none; }
}

<div id="app">
  <canvas id="game" aria-label="弹珠柏青哥游戏画面" style="display:none"></canvas>
  <canvas id="gl" aria-label="3D 弹珠柏青哥游戏画面"></canvas>
  <div id="floatLayer"></div>
  <div id="labels"></div>
  <div id="flash"></div>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <header id="hud">
    <div class="hud-card">
      <div class="hud-line main"><span>BALLS</span><b id="ballCount">120</b></div>

      <div class="hud-line"><span>JACKPOT</span><b id="jackpot">1,000</b></div>

    <button id="muteBtn" class="tool" aria-label="静音">♪</button>
  </footer>

  <div id="overlay" class="hidden"></div>
  <div id="boot">正在装填弹珠…</div>
</div>

  function hitSegment(b, s) {
    const dx = s.x2 - s.x1, dy = s.y2 - s.y1;
    const l2 = dx * dx + dy * dy;
    let t = l2 ? ((b.x - s.x1) * dx + (b.y - s.y1) * dy) / l2 : 0;
    t = clamp(t, 0, 1);
    const px = s.x1 + dx * t, py = s.y1 + dy * t;
    const nx = b.x - px, ny = b.y - py;
    const d2 = nx * nx + ny * ny;
    if (d2 >= b.r * b.r || d2 < .0001) return false;
    const d = Math.sqrt(d2), ux = nx / d, uy = ny / d;
    b.x = px + ux * (b.r + .1);
    b.y = py + uy * (b.r + .1);
    const vn = b.vx * ux + b.vy * uy;
    if (vn < 0) {
      b.vx -= (1 + s.bounce) * vn * ux;
      b.vy -= (1 + s.bounce) * vn * uy;
      b.vx *= .994; b.vy *= .994;
    }
    return true;
  }

  function physicsStep(dt) {
    for (let i = balls.length - 1; i >= 0; i--) {

      b.vy += GRAV * dt;
      b.vx *= .9993;
      b.x += b.vx * dt;
      b.y += b.vy * dt;

      // outer bounds / walls
      for (const w of walls) hitSegment(b, w);
      if (b.x < 24 + b.r) { b.x = 24 + b.r; if (b.vx < 0) b.vx *= -.55; }
      if (b.x > 396 - b.r) { b.x = 396 - b.r; if (b.vx > 0) b.vx *= -.55; }
      if (b.y < 70 + b.r) { b.y = 70 + b.r; if (b.vy < 0) b.vy *= -.55; }

      // pegs from spatial grid
      const cx = Math.floor(b.x / PEG_CELL), cy = Math.floor(b.y / PEG_CELL);
      for (let gx = cx - 1; gx <= cx + 1; gx++) {
        for (let gy = cy - 1; gy <= cy + 1; gy++) {
          const arr = pegGrid.get(`${gx},${gy}`);
          if (arr) for (const p of arr) collidePeg(b, p);
        }
      }

      // bumpers / spinner
      for (const p of bumpers) collideBumper(b, p);
      collideSpinner(b);

      // JP outer ring (hole in the middle)
      const jdx = b.x - jp.x, jdy = b.y - jp.y;
      const jd = Math.hypot(jdx, jdy);
      if (jd < jp.hole) {

        b.alive = false;
        continue;

        b.x = jp.x + nx * (jp.r + b.r + .5);
        b.y = jp.y + ny * (jp.r + b.r + .5);
        const vn = b.vx * nx + b.vy * ny;
        if (vn < 0) { b.vx -= 1.65 * vn * nx; b.vy -= 1.65 * vn * ny; }
        jp.pulse = .3;
        addScore(8, b.x, b.y - 10);
        burst(b.x, b.y, 4, C.gold, 80);
        tone(480, .04, "square", .05);
      }

      // start pocket
      if (Math.hypot(b.x - start.x, b.y - start.y) < start.r) {
        collectStart(b); b.alive = false; continue;
      }
      // tulips
      let caught = false;
      for (const t of tulips) {
        if (Math.hypot(b.x - t.x, b.y - t.y) < t.r) {
          addBalls(3); addScore(80, t.x, t.y - 12); bumpCombo();
          burst(t.x, t.y, 12, C.teal, 120); sndPocket(1);
          floatText("+3 BALLS", t.x, t.y - 20, C.teal, 10);
          t.pulse = .4; caught = true; break;
        }
      }
      if (caught) { b.alive = false; continue; }

      // bottom pockets
      for (const p of pockets) {
        if (Math.hypot(b.x - p.x, b.y - p.y) < p.r) {
          collectPocket(b, p); b.alive = false; caught = true; break;
        }
      }
      if (caught) continue;

      // trail and drain
      b.trail.push({ x: b.x, y: b.y });
      if (b.trail.length > 3) b.trail.shift();
      if (b.y > 870 || b.x < -20 || b.x > W + 20) b.alive = false;
      if (time - b.born > 35) b.alive = false;
    }
  }

  // ------------------------------------------------------------------ scoring
  function collectPocket(b, p) {
    bumpCombo();
    addBalls(p.balls);
    const gain = addScore(p.score, p.x, p.y - 18);
    jackpot = Math.min(999999, jackpot + Math.max(5, Math.round(p.score * .18)));
    p.pulse = .5;
    shake = Math.max(shake, p.balls >= 18 ? 7 : 3);
    burst(p.x, p.y, p.balls >= 18 ? 28 : 12, p.color, 220);
    floatText(`+${p.balls} BALLS`, p.x, p.y - 32, p.color, 10);
    sndPocket(p.balls >= 18 ? 3 : 1);
    if (p.balls >= 18) { flash = .22; announce("BONUS +18", "teal", 700); }
  }

  function collectStart(b) {
    addBalls(2);
    addScore(120, start.x, start.y - 18);
    bumpCombo();
    start.pulse = .6;
    feverGauge = Math.min(100, feverGauge + 3);
    burst(start.x, start.y, 16, C.teal, 160);
    sndStart();
    startSlots();
    shake = Math.max(shake, 3);
  }

  function winJackpot(b) {
    const prize = jackpot;
    bumpCombo();
    addBalls(55);
    addScore(prize, jp.x, jp.y - 26);
    jackpot = 800;
    jp.pulse = 1;
    shake = Math.max(shake, 14);
    flash = .5;
    burst(jp.x, jp.y, 70, C.gold, 300);
    burst(jp.x, jp.y, 30, C.cream, 220);
    sndJackpot();
    announce("JACKPOT!", "teal", 1600);
    toast(`JACKPOT +${fmt(prize)} SCORE`, 2400);
    triggerFever(15);
    slot.result = ["7", "7", "7"]; slot.glow = 1.5;
    best = Math.max(best, score);
    saveBest();
    updateHUD();
  }

  // ------------------------------------------------------------------ slots / fever
  function startSlots() {
    if (slot.spin > 0) return;
    slot.spin = 1.0;
    slot.tick = 0;
    slot.result = null;
    slot.display = [SYMBOLS[Math.floor(Math.random() * 4)], SYMBOLS[Math.floor(Math.random() * 4)], SYMBOLS[Math.floor(Math.random() * 4)]];
    sndSlot();
  }

  function finishSlots() {
    let result;
    if (feverGauge >= 100) {
      result = ["7", "7", "7"];
      feverGauge = 0;
    } else {
      const r = Math.random();
      if (r < .09) result = ["7", "7", "7"];
      else if (r < .14) result = ["JP", "JP", "JP"];
      else if (r < .34) {
        const s = SYMBOLS[Math.floor(Math.random() * 4)];
        result = [s, s, SYMBOLS[Math.floor(Math.random() * 4)]];
        if (result[0] === result[2]) result[2] = SYMBOLS[Math.floor(Math.random() * 4)];
      } else {
        result = [SYMBOLS[Math.floor(Math.random() * 4)], SYMBOLS[Math.floor(Math.random() * 4)], SYMBOLS[Math.floor(Math.random() * 4)]];
        if (result[0] === result[1] && result[1] === result[2]) result[2] = "BAR";
      }
    }
    slot.result = result;
    slot.display = result.slice();
    slot.spin = 0;
    slot.glow = .8;
    const all = result[0] === result[1] && result[1] === result[2];
    if (all && (result[0] === "7" || result[0] === "JP")) {
      triggerFever(15);
      addBalls(30);
      addScore(3000, 210, 150);
      announce(result[0] === "7" ? "777 FEVER!" : "JP FEVER!", "teal", 1500);
      sndFever();
      shake = Math.max(shake, 10);
      flash = .4;
      burst(210, 140, 50, C.gold, 260);
    } else if (all) {
      addBalls(15);
      addScore(900, 210, 150);
      announce("三连!", "", 900);
      sndPocket(3);
    } else if (result[0] === result[1] || result[1] === result[2] || result[0] === result[2]) {
      addBalls(5);
      addScore(200, 210, 150);
      announce("对子", "rose", 700);
      sndPocket(1);
    } else {
      addScore(60, 210, 150);
    }
    updateHUD();
  }

  function triggerFever(sec) {
    const was = feverT > 0;
    feverT = Math.max(feverT, sec);
    feverRain = 0;
    document.body.classList.add("fever");
    if (!was) {
      announce("FEVER!", "teal", 1600);
      sndFever();
      toast("FEVER：双层火力全开，自动落珠", 2400);
    }
    feverGauge = 0;
    slot.glow = 1;
    shake = Math.max(shake, 8);
    flash = .35;
  }

  // ------------------------------------------------------------------ update
  function update(dt) {
    time += dt;
    if (comboT > 0) {
      comboT -= dt;
      if (comboT <= 0) { combo = 0; }
    }
    if (feverT > 0) {
      feverT -= dt;
      feverRain -= dt;
      if (feverRain <= 0 && feverT > 0) {
        feverRain = .17;
        const fx = rand(60, 350);
        spawnBall(fx, 108, rand(-20, 20), 25, true);
        if (Math.random() < .25) burst(fx, 110, 4, C.gold, 90);
      }
      if (feverT <= 0) {
        feverT = 0;
        document.body.classList.remove("fever");
        announce("FEVER END", "rose", 800);
      }
    }

    // manual charge / auto fire
    if (charging) {
      charge = Math.min(1, charge + dt / 1.05);
      if (ui.powerFill) ui.powerFill.style.width = `${Math.round(charge * 100)}%`;
    } else if (auto && running) {
      autoCd -= dt;
      if (autoCd <= 0 && ballsLeft > 0) {
        fire(rand(.65, 1));
        autoCd = .85;
      }
    }
    if (running && ballsLeft <= 0) {
      rescueT -= dt;
      if (rescueT <= 0) {
        addBalls(15);
        rescueT = 9;
        announce("补给 +15", "teal", 800);
        toast("弹珠补给：+15", 1600);
        tone(700, .1, "square", .1, 200);
      }
    }

    if (slot.spin > 0) {
      slot.spin -= dt;
      slot.tick -= dt;
      if (slot.tick <= 0) {
        slot.tick = .08;
        slot.display = [SYMBOLS[Math.floor(Math.random() * 4)], SYMBOLS[Math.floor(Math.random() * 4)], SYMBOLS[Math.floor(Math.random() * 4)]];
        sndSlot();
      }
      if (slot.spin <= 0) finishSlots();
    }
    if (slot.glow > 0) slot.glow -= dt;

    updateLaunches(dt);
    // fixed physics
    physicsAcc += dt;
    let steps = 0;
    while (physicsAcc >= 1 / 120 && steps < 5) {
      physicsStep(1 / 120);
      physicsAcc -= 1 / 120;
      steps++;
    }
    if (steps === 5) physicsAcc = 0;

    // particles / floats / effects
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.vy += 420 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i];
      f.life -= dt;
      f.y -= 26 * dt;
      if (f.life <= 0) floats.splice(i, 1);
    }
    for (const p of pegs) if (p.flash > 0) p.flash -= dt;
    for (const p of bumpers) if (p.flash > 0) p.flash -= dt;
    for (const p of pockets) if (p.pulse > 0) p.pulse -= dt;
    for (const t of tulips) if (t.pulse > 0) t.pulse -= dt;
    if (start.pulse > 0) start.pulse -= dt;
    if (jp.pulse > 0) jp.pulse -= dt;
    if (spinner.hit > 0) spinner.hit -= dt;
    spinner.angle += dt * (2.2 + (spinner.hit > 0 ? 6 : 0));
    if (shake > 0) shake = Math.max(0, shake - dt * 26);
    if (flash > 0) flash = Math.max(0, flash - dt * 2.2);

    if (score > best) {
      best = score;
      if (time - lastSave > 2) { lastSave = time; saveBest(); }
    }
    if (!mapGoalDone && score >= MAPS[currentMap].goal) completeGoal();
    if (time - lastHud > .08) { lastHud = time; updateHUD(); }
  }

  let physicsAcc = 0;

  // ------------------------------------------------------------------ HUD
  function completeGoal() {
    if (mapGoalDone || !running) return;
    mapGoalDone = true;
    addBalls(40);
    jackpot += 500;
    feverGauge = 100;
    flash = .5; shake = Math.max(shake, 10);
    announce("目标达成!", "gold", 1900);
    toast(`地图目标 ${fmt(MAPS[currentMap].goal)} 达成 · +40 球 · JACKPOT +500`, 3200);
    burst(W / 2, 340, 32, C.gold, 260);
    burst(W / 2, 340, 18, C.teal, 220);
    sndJackpot();
    updateHUD();
  }

  function updateHUD() {
    if (ui.mapName) ui.mapName.textContent = `${MAPS[currentMap].name} · ${mapGoalDone ? "目标达成" : "目标 " + fmt(MAPS[currentMap].goal)}`;
    ui.balls.textContent = ballsLeft;

      ui.slotState.textContent = "FEVER";

      ui.feverPct.textContent = `${Math.floor(feverGauge)}%`;
      ui.feverBar.style.width = `${feverGauge}%`;
      ui.feverBar.classList.remove("hot");
      ui.feverBox.classList.toggle("fever-on", feverGauge >= 100);

    }
    const active = combo >= 2;
    ui.combo.classList.toggle("active", active);
    if (active) {
      ui.combo.innerHTML = `COMBO <b>${combo}</b><strong>x${comboMult().toFixed(1)}</strong>`;
    }
  }

  function drawScreen() {
    const x = 118, y = 145, w = 184, h = 88;
    ctx.fillStyle = "#05090c"; ctx.fillRect(x - 4, y - 4, w + 8, h + 8);
    ctx.fillStyle = "#0b1a1e"; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = feverT > 0 ? C.gold : "#31575a"; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
    drawPixelText(feverT > 0 ? "FEVER" : "777", x + w / 2, y + 11, 9, feverT > 0 ? C.gold : C.teal);
    const rw = 44, rh = 46, gap = 8;
    const startX = x + (w - (rw * 3 + gap * 2)) / 2;
    for (let i = 0; i < 3; i++) {
      const rx = startX + i * (rw + gap), ry = y + 22;
      ctx.fillStyle = "#030608"; ctx.fillRect(rx, ry, rw, rh);

      let s = slot.display[i];
      if (slot.result && slot.spin <= 0) s = slot.result[i];
      const col = s === "7" || s === "JP" ? C.gold : s === "★" ? C.cream : s === "●" ? C.rose : s === "BAR" ? C.teal : C.cream;
      drawPixelText(s, rx + rw / 2, ry + rh / 2 + 1, s === "BAR" ? 10 : 18, col);
    }

      drawPixelText(`${Math.ceil(feverT)}s`, x + w - 6, y + h - 8, 8, C.gold, "right");
    } else if (feverGauge >= 100) {
      drawPixelText("READY", x + w - 6, y + h - 8, 8, C.gold, "right");
    }
  }

  function drawWallsAndPegs() {
    // pegs
    for (const p of pegs) {
      const flash = p.flash > 0;
      ctx.fillStyle = "#241b12"; ctx.beginPath(); ctx.arc(p.x + 1.5, p.y + 1.5, p.r, 0, 7); ctx.fill();
      ctx.fillStyle = flash ? C.gold3 : (p.gold ? C.gold : "#c9b27a");
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
      ctx.fillStyle = flash ? "#fff" : "#f2e3b8";
      ctx.fillRect(p.x - 2, p.y - 3, 2, 2);
    }
    // bumpers
    for (const b of bumpers) {
      const f = b.flash > 0;
      ctx.fillStyle = "#271014"; ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 3, 0, 7); ctx.fill();
      ctx.fillStyle = f ? C.gold3 : C.red; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
      ctx.strokeStyle = f ? C.gold : "#f1b06a"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(b.x, b.y, b.r - 3, 0, 7); ctx.stroke();
      ctx.fillStyle = f ? "#fff2c0" : "#ffd5a2"; ctx.fillRect(b.x - 2, b.y - 3, 3, 3);
    }
    // spinner
    ctx.save(); ctx.translate(spinner.x, spinner.y); ctx.rotate(spinner.angle);
    ctx.fillStyle = spinner.hit > 0 ? C.gold3 : "#0a1417"; ctx.beginPath(); ctx.arc(0, 0, spinner.r + 7, 0, 7); ctx.fill();
    for (let i = 0; i < 4; i++) {

      ctx.fillStyle = spinner.hit > 0 ? C.gold : C.teal;

      ctx.fillStyle = "#e8f4e8"; ctx.fillRect(spinner.r - 5, -3, 4, 6);
    }
    ctx.fillStyle = C.black; ctx.beginPath(); ctx.arc(0, 0, 5, 0, 7); ctx.fill();

    ctx.fillStyle = jp.pulse > 0 ? "#4a2e0d" : "#16130d";

    ctx.fillStyle = C.gold2; ctx.beginPath(); ctx.arc(jp.x, jp.y, jp.r, 0, 7); ctx.fill();
    ctx.fillStyle = jp.pulse > 0 ? C.gold3 : "#2a1d0a"; ctx.beginPath(); ctx.arc(jp.x, jp.y, jp.r - 5, 0, 7); ctx.fill();
    ctx.strokeStyle = C.gold; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(jp.x, jp.y, jp.hole + 2, 0, 7); ctx.stroke();
    drawPixelText("JP", jp.x, jp.y + 1, 15, C.gold3);

  function drawBalls() {
    for (const l of launches) {
      const p = launchPos(l);
      drawBallShape(p.x, p.y, 1, l.seed);
      ctx.fillStyle = "rgba(255,240,190,.25)"; ctx.fillRect(p.x - 2, p.y + 6, 4, 3);

  function drawBallShape(x, y, s, hue) {
    ctx.fillStyle = "#3b2b1b"; ctx.fillRect(x - 5, y - 5, 10, 10);
    ctx.fillStyle = hue > .93 && feverT > 0 ? C.gold3 : "#f3e7c6"; ctx.fillRect(x - 4, y - 4, 8, 8);

    ctx.fillStyle = "#aa8d62"; ctx.fillRect(x + 2, y + 2, 2, 2);
  }
  function launchPos(l) {
    const t = Math.min(1, l.t);
    if (t < .72) {
      const u = t / .72;
      const e = 1 - Math.pow(1 - u, 2.2);
      return { x: 379 + Math.sin(u * 9 + l.seed) * 1.5, y: 790 + (145 - 790) * e };
    }
    const u = (t - .72) / .28;
    const endX = 338 - (l.power || .8) * 95;
    const p0 = { x: 379, y: 145 }, p1 = { x: 368, y: 94 }, p2 = { x: endX, y: 108 };
    const a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, c = u * u;
    return { x: a * p0.x + b * p1.x + c * p2.x, y: a * p0.y + b * p1.y + c * p2.y };
  }

  function drawParticles() {
    for (const p of particles) {
      const a = Math.max(0, p.life / p.max);
      ctx.globalAlpha = .4 + a * .6;
      ctx.fillStyle = p.color;
      ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }
  function drawFloats() {
    for (const f of floats) {
      const a = Math.max(0, f.life / f.max);
      ctx.globalAlpha = a;
      drawPixelText(f.text, f.x, f.y, f.size, f.color);
    }
    ctx.globalAlpha = 1;
  }

  const floatPool = [];
  function renderFloats() {
    if (!scene3d) return;
    for (let i = 0; i < floats.length; i++) {
      const f = floats[i];
      let el = floatPool[i];
      if (!el) { el = document.createElement("div"); el.className = "float3d"; floatLayer.appendChild(el); floatPool[i] = el; }
      const p = scene3d.project(f.x, f.y, 1.5);
      el.textContent = f.text;
      el.style.left = `${p.x}px`;
      el.style.top = `${p.y}px`;
      el.style.opacity = String(Math.max(0, f.life / f.max));
      el.style.color = f.color;
      el.style.fontSize = `${f.size + 1}px`;
      el.style.display = p.visible ? "block" : "none";
    }
    for (let i = floats.length; i < floatPool.length; i++) floatPool[i].style.display = "none";
  }

  function render() {
    sceneView.feverT = feverT;
    sceneView.feverGauge = feverGauge;
    sceneView.flash = flash;
    sceneView.shake = shake;
    sceneView.jackpot = jackpot;
    sceneView.combo = combo;
    sceneView.time = time;
    if (scene3d) {
      scene3d.sync(sceneView);
      updateLabels();
      renderFloats();
      if (flashEl) flashEl.style.opacity = String(Math.min(.4, flash * .4));
    } else {
      ctx.save();
      drawCabinet(); drawScreen(); drawWallsAndPegs(); drawBalls(); drawParticles(); drawFloats();
      ctx.restore();
    }
  }

  // ------------------------------------------------------------------ UI screens
  function showTitle() {
    running = false; firing = false; charging = false; auto = false;
    charge = 0;
    ui.auto.classList.remove("on");
    ui.launch.classList.remove("charging", "held");
    if (ui.powerFill) ui.powerFill.style.width = "0%";
    ui.overlay.classList.remove("hidden");
    const cards = MAPS.map((m) => {
      const active = m.id === currentMap ? " active" : "";
      const desc = m.desc.replace("\n", " · ");
      return `<button class="map-card${active}" data-map="${m.id}" style="border-color:${active ? m.theme.accent : ""}">
        <b>${m.name}</b><span>${m.tag}<br>${desc}</span><em>目标 ${fmt(m.goal)} · ${active ? "开打" : "选这张"}</em>
      </button>`;
    }).join("");
    ui.overlay.innerHTML = `
      <div class="panel">
        <div class="kicker">PACHINKO · 3D VOXEL</div>
        <div class="logo">弹珠<span>FEVER</span></div>
        <p class="sub">按住蓄力，松手投球。<br>不同机台，不同钉阵和 JP。</p>
        <p class="best">最高分 <b>${fmt(best)}</b></p>
        <p class="map-hint">选择机台直接开始 · 换图即时切换</p>
        <div class="map-picks">${cards}</div>
        <button class="btn secondary" id="howBtn">怎么玩</button>
      </div>`;
    ui.overlay.querySelectorAll(".map-card").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const id = Number(btn.dataset.map);
        if (id === currentMap) { startGame(); return; }
        switchMap(id);
      });
    });
    $("howBtn").addEventListener("click", (e) => { e.stopPropagation(); showHelp(false); });
  }

  let helpResume = false;
  function showHelp(fromGame = false) {
    helpResume = fromGame;
    if (fromGame) running = false;
    firing = false;
    ui.overlay.classList.remove("hidden");
    ui.overlay.innerHTML = `
      <div class="panel">
        <div class="kicker">HOW TO PLAY</div>
        <h2>弹珠柏青哥</h2>
        <ul class="help-list">
          <li><b>01</b><span>按住「蓄力」或画面蓄力，松手投球。力度决定入口位置，弱球靠右，强球切进左侧。</span></li>
          <li><b>02</b><span>撞保险杠 / 转盘 / 钉子赚分数；转盘攒 FEVER 能量。顶部出球口保持可见，看球进出。</span></li>
          <li><b>03</b><span>底部 START 口袋触发 777 滚轮。777 或 JP 三个相同 = FEVER。</span></li>
          <li><b>04</b><span>FEVER 15 秒：自动落珠、得分 ×2。打进中心 JP 直接赢 JACKPOT。</span></li>
          <li><b>05</b><span>MAP 回到地图选择；三张图有不同钉阵和目标分。达成目标 +40 球、JACKPOT +500。</span></li>
        </ul>
        <button class="btn" id="helpStart">开打</button>
        <button class="btn ghost" id="helpClose">${helpResume ? "继续" : "返回"}</button>
      </div>`;
    $("helpStart").addEventListener("click", (e) => { e.stopPropagation(); startGame(); });
    $("helpClose").addEventListener("click", (e) => {
      e.stopPropagation();
      if (helpResume) { helpResume = false; ui.overlay.classList.add("hidden"); running = true; }
      else showTitle();
    });
  }

  function startGame() {
    initAudio();
    resetGame();
    clearAnnouncements();
    running = true;
    ui.overlay.classList.add("hidden");
    if (ui.mapName) ui.mapName.textContent = MAPS[currentMap].name;
    toast(`按住蓄力，松手投球 · ${MAPS[currentMap].name} · 打进 777 进入 FEVER`, 2800);
    document.body.classList.remove("fever");
  }

  function switchMap(id) {
    if (!MAPS[id]) return;
    running = false; auto = false; charging = false; charge = 0;
    ui.auto.classList.remove("on");
    ui.launch.classList.remove("charging", "held");
    if (ui.powerFill) ui.powerFill.style.width = "0%";
    currentMap = id;
    buildBoard(id);
    makeScene();
    try { history.replaceState(null, "", `?map=${id}&start=1`); } catch (_) {}
    startGame();
  }

  function resetGame() {
    ballsLeft = 120; score = 0; jackpot = 1000; mapGoalDone = false;
    combo = 0; comboT = 0; bestCombo = 0;
    feverGauge = 0; feverT = 0; feverRain = 0;
    firing = false; charging = false; charge = 0; auto = false; autoCd = 0; fireCd = 0; rescueT = 0;
    ui.launch.classList.remove("charging");
    if (ui.powerFill) ui.powerFill.style.width = "0%";
    shake = 0; flash = 0; physicsAcc = 0;
    balls.length = 0; launches.length = 0; particles.length = 0; floats.length = 0;
    slot.spin = 0; slot.result = null; slot.display = ["7", "★", "◆"]; slot.glow = 0;
    ui.auto.classList.remove("on");
    if (ui.mapName) ui.mapName.textContent = MAPS[currentMap].name;
    updateHUD();
  }

  function saveBest() {
    try { localStorage.setItem(BEST_KEY, String(Math.floor(best))); } catch (_) {}
  }

  // ------------------------------------------------------------------ input
  function isOverlay() { return !ui.overlay.classList.contains("hidden"); }

  function beginCharge(e) {
    if (isOverlay() || !running) return;
    initAudio();
    if (e) e.preventDefault();
    if (ballsLeft <= 0) return;
    charging = true;
    charge = 0;
    ui.launch.classList.add("charging");
    if (ui.powerFill) ui.powerFill.style.width = "0%";
    tone(240, .06, "square", .05, 120);
  }
  function releaseCharge() {
    if (!charging) return;
    charging = false;
    ui.launch.classList.remove("charging");
    const p = Math.max(.35, charge);
    charge = 0;
    if (ui.powerFill) ui.powerFill.style.width = "0%";
    if (p > 0) fire(p);
  }

  ui.launch.addEventListener("pointerdown", (e) => {
    e.stopPropagation(); e.preventDefault();
    ui.launch.classList.add("held");
    beginCharge(e);
  });
  const releaseLaunch = () => { ui.launch.classList.remove("held"); releaseCharge(); };
  window.addEventListener("pointerup", releaseLaunch);
  window.addEventListener("pointercancel", releaseLaunch);
  ui.launch.addEventListener("pointerleave", () => { ui.launch.classList.remove("held"); });

  function bindCanvasInput(c) {
    c.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      beginCharge(e);
    });
  }
  window.addEventListener("pointerup", () => releaseCharge());

  window.addEventListener("keydown", (e) => {
    if (e.repeat) return;
    if (e.code === "Space") { e.preventDefault(); beginCharge(e); }
    if (e.key.toLowerCase() === "a") toggleAuto();
    if (e.key.toLowerCase() === "m") toggleMute();
  });
  window.addEventListener("keyup", (e) => { if (e.code === "Space") releaseCharge(); });

  function toggleAuto() {
    if (!running) return;
    auto = !auto;
    ui.auto.classList.toggle("on", auto);
    toast(auto ? "AUTO ON" : "AUTO OFF", 900);
  }
  function toggleMute() {
    muted = !muted;
    ui.mute.textContent = muted ? "✕" : "♪";
    if (master) master.gain.value = muted ? 0 : .26;
    try { localStorage.setItem(MUTE_KEY, muted ? "1" : "0"); } catch (_) {}
  }
  ui.auto.addEventListener("click", (e) => { e.stopPropagation(); toggleAuto(); });
  ui.mute.addEventListener("click", (e) => { e.stopPropagation(); toggleMute(); });
  ui.help.addEventListener("click", (e) => { e.stopPropagation(); showHelp(running); });
  ui.map.addEventListener("click", (e) => { e.stopPropagation(); showTitle(); });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { firing = false; charging = false; auto = false; ui.auto.classList.remove("on"); ui.launch.classList.remove("charging"); }
  });

  // ------------------------------------------------------------------ loop
  let last = 0;
  let fpsCount = 0, fpsTime = 0;
  window.__fps = 0;
  function frame(now) {
    if (!last) last = now;
    const dt = Math.max(0, Math.min(.034, (now - last) / 1000));
    last = now;
    if (running) update(dt);
    else {
      // gentle ambient board motion on title
      time += dt;
      spinner.angle += dt * .7;
    }
    render();
    fpsCount++;
    if (dt > 0) fpsTime += dt;
    if (fpsTime > 1) { window.__fps = Math.round(fpsCount / fpsTime); fpsCount = 0; fpsTime = 0; }
    requestAnimationFrame(frame);
  }

  // ------------------------------------------------------------------ boot
  ui.mute.textContent = muted ? "✕" : "♪";
  makeScene();
  updateHUD();
  const bootDone = () => {
    ui.boot.classList.add("hide");
    if (startParam) startGame(); else showTitle();
    requestAnimationFrame(frame);
  };
  document.fonts.ready.then(bootDone).catch(bootDone);

  // expose for debugging / tuning
  window.__pachinko = {
    get state() { return { ballsLeft, score, jackpot, feverT, feverGauge, combo, balls: balls.length, slot: slot.result, fps: window.__fps }; },
    start: startGame, fire, toggleAuto, reset: resetGame,
    debugStart: () => { startSlots(); },
    debugFever: () => { triggerFever(15); },
    debugJackpot: () => { winJackpot(null); },
    debugSpawn: (x, y) => { spawnBall(x, y, 0, 0, false); },
  };
})();

</script>
</body>
</html>
